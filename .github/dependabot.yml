version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: pip
    directories:
      - /
      - /DNA_Software/Launcher/Locks
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      python:
        patterns: ['*']
  - package-ecosystem: nuget
    directory: /DNA_Software/Launcher
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: npm
    directory: /tools/quality
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      quality-tools:
        patterns: ['*']
