name: Security and dependency checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true
jobs:
  csharp:
    if: vars.ENABLE_LICENSED_CODEQL == 'true'
    name: C# — manual build
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '8.0.x'
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: csharp
          build-mode: manual
      - name: Prepare embedded application source
        run: |
          python DNA_Software/Launcher/fetch_webview_sdk.py
          if ($LASTEXITCODE -ne 0) { throw 'WebView2 SDK preparation failed' }
          python DNA_Software/Launcher/public_package.py --payload
      - name: Build C# with resolved NuGet references
        run: dotnet build DNA_Software/Launcher/DNAWorkbench.csproj --configuration Release --no-incremental
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: /language:csharp
  interpreted:
    if: vars.ENABLE_LICENSED_CODEQL == 'true'
    name: Python, JavaScript and Actions
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: python,javascript-typescript,actions
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: /language:interpreted-and-actions
  dependencies:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: high
  python-security:
    name: Bandit, Bearer and Python dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-security.txt
      - name: Fetch checksum-pinned Bearer CLI
        run: |
          mkdir -p security-tools
          curl --proto '=https' --tlsv1.2 -fLsS https://github.com/Bearer/bearer/releases/download/v2.1.3/bearer_2.1.3_linux_amd64.tar.gz -o security-tools/bearer.tar.gz
          echo '974d4ad7bb71bc578675684d444e345e8fbad91c85557aac035406ef5cc04c68  security-tools/bearer.tar.gz' | sha256sum --check --strict
          tar -xzf security-tools/bearer.tar.gz -C security-tools bearer
      - name: Scan production source and declared Python pins
        run: python scripts/Security-Audit.py --output security-reports --bearer security-tools/bearer
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        if: always() && hashFiles('security-reports/bandit.sarif') != ''
        with:
          sarif_file: security-reports/bandit.sarif
          category: bandit-production
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        if: always() && hashFiles('security-reports/bearer.sarif') != ''
        with:
          sarif_file: security-reports/bearer.sarif
          category: bearer-production
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: python-security-reports
          path: security-reports/
          retention-days: 7
  nuget-security:
    name: NuGet vulnerability audit
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '8.0.x'
      - name: Audit direct and transitive NuGet packages
        shell: pwsh
        run: |
          dotnet restore DNA_Software/Launcher/DNAWorkbench.csproj
          if ($LASTEXITCODE -ne 0) { throw 'NuGet restore failed' }
          $report = dotnet list DNA_Software/Launcher/DNAWorkbench.csproj package --vulnerable --include-transitive --format json
          if ($LASTEXITCODE -ne 0) { throw 'NuGet audit failed' }
          $report | Set-Content -Encoding utf8 nuget-audit.json
          $data = ($report -join "`n") | ConvertFrom-Json
          if ($data.errors) { throw 'NuGet reported audit errors' }
          foreach ($project in $data.projects) {
            foreach ($framework in $project.frameworks) {
              foreach ($package in @($framework.topLevelPackages) + @($framework.transitivePackages)) {
                if ($package.vulnerabilities) { throw "Vulnerable NuGet package: $($package.id)" }
              }
            }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: nuget-security-report
          path: nuget-audit.json
          retention-days: 7
